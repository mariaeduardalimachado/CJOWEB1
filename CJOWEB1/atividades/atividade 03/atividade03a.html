<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/pagina03.css">
</head>
<body>
    <form action="" method="post" class="pg3">
        <div>
            <h1>Realiaze seu Cadastro</h1>
        <p>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" size="30" maxlength="30" required placeholder="Seu nome" >
           
        </p>
         <p>
            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" name="sobrenome" placeholder="Seu sobrenome"> 
           
        </p> 
        <p>
            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" size="15" maxlength="15" placeholder="(00) 00000-0000" required>
           
        </p>  
        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="seu.email@exemplo.com">
        </p>   
        <p>
            <label for="number">Idade:</label>
            <input type="number" id="number" name="number" min="1" max="100" step="1" placeholder="0" required>
        </p>   
        <p>
            <label for="data">Data de nascimento:</label>
            <input type="date" id="data" name="data" required min="2026-08-28" max="1900-12-31" placeholder="DD/MM/YYYY">
        </p>   
        <p>
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required placeholder="************">
        </p>
        <p>
            <label for="arquivo">Documento com foto:</label>
            <input type="file" id="arquivo" name="arquivo" required>
        </p>
        <p>
           
            <button type='reset' onclick="mensagem()">Realizar cadastro</button>
          
        </p>
         <p><a href="atividade03.html">Retorne aqui e faça seu login</a></p>
        </div>
    </form>
    <script>
        function mensagem() {
            alert("Cadastro realizado com sucesso!");
        }
    </script>
</body>
</html>
